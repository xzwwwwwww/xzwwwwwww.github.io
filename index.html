<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小站 · My Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=46">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a class="logo" href="#home" data-i18n="logo">小站</a>
        <span class="logo-mark" aria-hidden="true">✳</span>
      </div>
      <div class="header-right">
        <nav class="nav">
          <a href="#home" class="nav-link active" data-i18n="navHome">首页</a>
          <a href="#life" class="nav-link" data-i18n="navLife">生活碎碎念</a>
          <a href="#inbox" class="nav-link" data-i18n="navInbox">留言信箱</a>
          <a href="#game" class="nav-link" data-i18n="navGame">小游戏</a>
          <a href="#kids" class="nav-link" data-i18n="navKids">小朋友</a>
          <a href="#space" class="nav-link" data-i18n="navSpace">你和我</a>
        </nav>
        <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 首页 -->
    <section id="home" class="page active">
      <div class="hero">
        <p class="hero-kicker">MY CORNER · 小站手记 <span class="hero-star" aria-hidden="true">✳</span></p>
        <h1 data-i18n="heroTitle">你好，欢迎来到我的小站</h1>
        <p class="hero-sub" data-i18n="heroSub">在这里记录生活，存放读过的书与想过的路。</p>
        <div class="day-card">
          <div class="day-row day-row-top">
            <span id="day-date"></span>
            <span id="day-lunar"></span>
          </div>
          <div id="day-time" class="day-clock"></div>
          <div id="day-yiji" class="day-row"></div>
        </div>
        <p class="scene-caption" data-i18n="sceneCaption">今天也要好好吃饭，认真生活 🍜</p>
        <span class="float-mark fm-a" aria-hidden="true">✦</span>
        <span class="float-mark fm-b" aria-hidden="true">❋</span>
        <div class="marquee" aria-hidden="true">
          <div class="marquee-track">
            <span>记录 RECORD ✳ 生活 LIFE ✳ 分享 SHARE ✳ 游戏 PLAY ✳ 阅读 READ ✳ 成长 GROW ✳ </span>
            <span>记录 RECORD ✳ 生活 LIFE ✳ 分享 SHARE ✳ 游戏 PLAY ✳ 阅读 READ ✳ 成长 GROW ✳ </span>
          </div>
        </div>
      </div>
    </section>

    <!-- 生活碎碎念 -->
    <section id="life" class="page">
      <h2 class="section-title" data-i18n="lifeTitle">生活碎碎念</h2>
      <span class="float-mark fm-c" aria-hidden="true">✳</span>
      <span class="float-mark fm-d" aria-hidden="true">✦</span>
      <div class="life-scene" role="img" aria-label="窗边的小书桌"></div>
      <div id="life-warm" class="life-warm"></div>
      <div class="life-owner-bar">
        <button id="life-write-btn" class="owner-toggle">✎ 写碎碎念</button>
      </div>
      <div id="life-login" class="inbox-form-card life-login hidden">
        <input id="life-email" type="email" maxlength="40" autocomplete="off">
        <input id="life-password" type="password" maxlength="30">
        <button id="life-login-btn" class="inbox-submit"></button>
        <p id="life-login-status" class="inbox-status"></p>
      </div>
      <div id="life-composer" class="inbox-form-card life-composer hidden">
        <input id="life-date" type="text" maxlength="20" autocomplete="off">
        <textarea id="life-text" rows="4" maxlength="1000"></textarea>
        <textarea id="life-text-en" rows="3" maxlength="1000"></textarea>
        <div class="life-img-row">
          <label class="life-img-add">
            <input id="life-images" type="file" accept="image/*" multiple>
            <span>＋</span>
          </label>
          <div id="life-img-previews" class="life-img-previews"></div>
        </div>
        <button id="life-publish" class="inbox-submit"></button>
        <p id="life-status" class="inbox-status"></p>
      </div>
      <div id="life-timeline" class="timeline"></div>
      <div id="life-lightbox" class="life-lightbox hidden"><img id="life-lightbox-img" alt=""></div>
    </section>

    <!-- 留言信箱 -->
    <section id="inbox" class="page">
      <h2 class="section-title" data-i18n="inboxTitle">留言信箱</h2>
      <div class="inbox-form-card">
        <input id="msg-username" type="text" maxlength="20">
        <textarea id="msg-content" rows="4" maxlength="500"></textarea>
        <button id="msg-submit" class="inbox-submit"></button>
        <p id="msg-status" class="inbox-status"></p>
      </div>
      <div id="msg-wall" class="msg-wall"></div>
      <div class="owner-entry">
        <button id="owner-toggle" class="owner-toggle"></button>
      </div>
      <div id="owner-panel" class="owner-panel hidden"></div>
    </section>

    <!-- 小游戏 -->
    <section id="game" class="page">
      <h2 class="section-title" data-i18n="gameTitle">小游戏</h2>
      <div class="game-grid" id="game-grid">
        <button class="game-box box-sudoku" data-game="sudoku">
          <span class="box-chip"><span class="box-name" data-i18n="tabSudoku">数独</span></span>
        </button>
        <button class="game-box box-miner" data-game="miner">
          <span class="box-chip"><span class="box-name" data-i18n="tabMiner">黄金矿工</span></span>
        </button>
        <button class="game-box box-pvz" data-game="pvz">
          <span class="box-chip"><span class="box-name" data-i18n="tabPvz">植物大战僵尸</span></span>
        </button>
        <button class="game-box box-sweeper" data-game="sweeper">
          <span class="box-chip"><span class="box-name" data-i18n="tabSweeper">扫雷</span></span>
        </button>
        <button class="game-box box-snake" data-game="snake">
          <span class="box-chip"><span class="box-name" data-i18n="tabSnake">贪吃蛇</span></span>
        </button>
        <button class="game-box box-poem" data-game="poem">
          <span class="box-chip"><span class="box-name" data-i18n="tabPoem">古诗词</span></span>
        </button>
        <button class="game-box box-gomoku" data-game="gomoku">
          <span class="box-chip"><span class="box-name" data-i18n="tabGomoku">五子棋</span></span>
        </button>
      </div>
      <button id="game-back" class="game-back hidden" data-i18n="backToGames">← 返回游戏列表</button>
      <div id="panel-sudoku" class="game-panel">
        <div class="game-card sudoku-card">
          <div id="sudoku-levels" class="ms-levels sudoku-levels"></div>
          <div class="sudoku-info">
            <span id="sudoku-level-label"></span>
            <span id="sudoku-stars" class="sudoku-stars"></span>
            <span id="sudoku-time"></span>
          </div>
          <div id="sudoku-board" class="sudoku-board"></div>
          <div id="sudoku-pad" class="sudoku-pad"></div>
          <div class="sudoku-tools">
            <button id="sudoku-notes" class="ms-level sudoku-tool"></button>
            <button id="sudoku-erase" class="ms-level sudoku-tool"></button>
            <button id="sudoku-hint" class="ms-level sudoku-tool"></button>
            <button id="sudoku-reset" class="ms-level sudoku-tool"></button>
          </div>
          <div id="sudoku-win" class="sudoku-win hidden">
            <p id="sudoku-win-text"></p>
            <p id="sudoku-win-best" class="sudoku-win-best"></p>
            <button id="sudoku-next" class="inbox-submit"></button>
          </div>
          <div id="sudoku-start" class="game-start">
            <button id="sudoku-start-btn" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-miner" class="game-panel">
        <div class="game-card">
          <canvas id="game-canvas" width="760" height="500"></canvas>
          <div class="game-bar">
            <button id="game-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-pvz" class="game-panel">
        <div class="game-card">
          <div id="pvz-levels" class="ms-levels pvz-levels"></div>
          <canvas id="pvz-canvas" width="800" height="600"></canvas>
          <div class="game-bar">
            <button id="pvz-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-sweeper" class="game-panel">
        <div class="game-card">
          <div id="ms-levels" class="ms-levels"></div>
          <div class="ms-bar">
            <span id="ms-mines"></span>
            <button id="ms-reset" class="ms-reset">😀</button>
            <span id="ms-time"></span>
          </div>
          <div class="ms-scroll">
            <div id="ms-grid" class="ms-grid"></div>
          </div>
          <p id="ms-status" class="inbox-status"></p>
          <button id="ms-restart" class="inbox-submit ms-restart">重新开始</button>
        </div>
      </div>
      <div id="panel-snake" class="game-panel">
        <div class="game-card">
          <div id="snake-modes" class="ms-levels snake-modes"></div>
          <canvas id="snake-canvas" width="520" height="520"></canvas>
          <div class="game-bar">
            <button id="snake-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-poem" class="game-panel">
        <div class="game-card poem-card">
          <div class="poem-bar">
            <span id="poem-progress"></span>
            <select id="poem-level-select"></select>
          </div>
          <h3 id="poem-title"></h3>
          <p id="poem-author" class="poem-author"></p>
          <div id="poem-quiz">
            <p id="poem-question"></p>
            <input id="poem-answer" type="text" maxlength="30" autocomplete="off">
            <button id="poem-submit" class="inbox-submit"></button>
            <p id="poem-status" class="inbox-status"></p>
          </div>
          <div id="poem-full" class="hidden">
            <div id="poem-lines"></div>
            <button id="poem-next" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-gomoku" class="game-panel">
        <div class="game-card gomoku-card">
          <div id="gomoku-modes" class="ms-levels gomoku-modes"></div>
          <div class="gomoku-info">
            <span id="gomoku-mode-label"></span>
            <span id="gomoku-turn"></span>
            <span id="gomoku-count"></span>
          </div>
          <canvas id="gomoku-canvas" width="520" height="520"></canvas>
          <p id="gomoku-status" class="inbox-status"></p>
          <div id="gomoku-online" class="gomoku-online hidden">
            <p id="gomoku-room-info" class="gomoku-room-info"></p>
            <div class="gomoku-room-form">
              <input id="gomoku-code" type="text" maxlength="6" autocomplete="off">
              <button id="gomoku-join" class="ms-level"></button>
              <button id="gomoku-create" class="ms-level"></button>
              <button id="gomoku-leave" class="ms-level hidden"></button>
            </div>
          </div>
          <div class="game-bar" id="gomoku-bar">
            <button id="gomoku-undo" class="inbox-submit"></button>
            <button id="gomoku-restart" class="inbox-submit"></button>
          </div>
          <div id="gomoku-result" class="gomoku-result hidden">
            <p id="gomoku-result-text"></p>
            <button id="gomoku-again" class="inbox-submit"></button>
            <button id="gomoku-rematch" class="inbox-submit hidden"></button>
            <button id="gomoku-endmatch" class="inbox-submit hidden"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 小朋友（儿童向专区） -->
    <section id="kids" class="page">
      <h2 class="section-title" data-i18n="kidsTitle">小朋友专区</h2>
      <div class="game-grid" id="kids-grid">
        <button class="game-box kids-box-explore" data-cat="explore">
          <span class="box-chip"><span class="box-name" data-i18n="kidsCatExplore">知识探索</span></span>
        </button>
        <button class="game-box kids-box-craft" data-cat="craft">
          <span class="box-chip"><span class="box-name" data-i18n="kidsCatCraft">创意手工</span></span>
        </button>
        <button class="game-box kids-box-games" data-cat="games">
          <span class="box-chip"><span class="box-name" data-i18n="kidsCatGames">互动游戏</span></span>
        </button>
        <button class="game-box kids-box-grow" data-cat="grow">
          <span class="box-chip"><span class="box-name" data-i18n="kidsCatGrow">成长陪伴</span></span>
        </button>
        <button class="game-box kids-box-stage" data-cat="stage">
          <span class="box-chip"><span class="box-name" data-i18n="kidsCatStage">展示舞台</span></span>
        </button>
      </div>
      <button id="kids-back" class="game-back hidden" data-i18n="kidsBack">← 返回</button>

      <div id="kids-cat-explore" class="kids-cat-panel">
        <div class="game-grid kids-col-grid" data-cat="explore"></div>
        <button class="game-back kids-col-back hidden" data-i18n="kidsBackCols">← 返回栏目</button>
        <div class="kids-col-pages" data-cat="explore"></div>
      </div>
      <div id="kids-cat-craft" class="kids-cat-panel">
        <div class="game-grid kids-col-grid" data-cat="craft"></div>
        <button class="game-back kids-col-back hidden" data-i18n="kidsBackCols">← 返回栏目</button>
        <div class="kids-col-pages" data-cat="craft"></div>
      </div>
      <div id="kids-cat-grow" class="kids-cat-panel">
        <div class="game-grid kids-col-grid" data-cat="grow"></div>
        <button class="game-back kids-col-back hidden" data-i18n="kidsBackCols">← 返回栏目</button>
        <div class="kids-col-pages" data-cat="grow"></div>
      </div>
      <div id="kids-cat-stage" class="kids-cat-panel">
        <div class="game-grid kids-col-grid" data-cat="stage"></div>
        <button class="game-back kids-col-back hidden" data-i18n="kidsBackCols">← 返回栏目</button>
        <div class="kids-col-pages" data-cat="stage"></div>
      </div>

      <!-- 互动游戏 -->
      <div id="kids-cat-games" class="kids-cat-panel">
        <div class="game-grid" id="kids-games-grid">
          <button class="game-box kids-box-doodle" data-kidsgame="doodle">
            <span class="box-chip"><span class="box-name" data-i18n="kidsGameDoodle">涂鸦画板</span></span>
          </button>
          <button class="game-box kids-box-mole" data-kidsgame="mole">
            <span class="box-chip"><span class="box-name" data-i18n="kidsGameMole">打地鼠</span></span>
          </button>
          <button class="game-box kids-box-math2" data-kidsgame="math2">
            <span class="box-chip"><span class="box-name" data-i18n="kidsGameMath2">口算 · 二年级下</span></span>
          </button>
          <button class="game-box kids-box-math3" data-kidsgame="math3">
            <span class="box-chip"><span class="box-name" data-i18n="kidsGameMath3">口算 · 三年级下</span></span>
          </button>
        </div>
        <button id="kids-games-back" class="game-back hidden" data-i18n="kidsBackGames">← 返回游戏列表</button>

      <!-- 涂鸦画板 -->
      <div id="kids-panel-doodle" class="game-panel kids-panel">
        <div class="game-card kids-card">
          <div class="doodle-toolbar">
            <div id="doodle-palette" class="doodle-palette"></div>
            <div class="doodle-tools">
              <div id="doodle-sizes" class="doodle-sizes"></div>
              <button id="doodle-eraser" class="kids-btn">🧽</button>
              <button id="doodle-clear" class="kids-btn">🗑️</button>
              <button id="doodle-save" class="kids-btn">💾</button>
            </div>
          </div>
          <div class="doodle-canvas-wrap">
            <canvas id="doodle-canvas" width="720" height="460"></canvas>
          </div>
        </div>
      </div>

      <!-- 打地鼠 -->
      <div id="kids-panel-mole" class="game-panel kids-panel">
        <div class="game-card kids-card">
          <div class="mole-bar">
            <span id="mole-score"></span>
            <span id="mole-time"></span>
            <span id="mole-best"></span>
          </div>
          <div id="mole-grid" class="mole-grid"></div>
          <p id="mole-status" class="inbox-status"></p>
          <div class="game-bar">
            <button id="mole-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>

      <!-- 口算小问答 · 二年级下册 -->
      <div id="kids-panel-math2" class="game-panel kids-panel">
        <div class="game-card kids-card kids-math-card">
          <div id="m2-play">
            <div class="math-bar">
              <span id="m2-progress"></span>
              <span id="m2-timer"></span>
            </div>
            <p id="m2-question" class="math-question"></p>
            <div id="m2-options" class="math-options"></div>
            <div id="m2-check" class="math-check hidden">✓</div>
          </div>
          <div id="m2-result" class="hidden">
            <p id="m2-result-text" class="math-result-text"></p>
            <button id="m2-again" class="inbox-submit"></button>
          </div>
          <div id="m2-start" class="game-start">
            <button id="m2-start-btn" class="inbox-submit"></button>
          </div>
        </div>
      </div>

      <!-- 口算小问答 · 三年级下册 -->
      <div id="kids-panel-math3" class="game-panel kids-panel">
        <div class="game-card kids-card kids-math-card">
          <div id="m3-play">
            <div class="math-bar">
              <span id="m3-progress"></span>
              <span id="m3-timer"></span>
            </div>
            <p id="m3-question" class="math-question"></p>
            <div id="m3-options" class="math-options"></div>
            <div id="m3-check" class="math-check hidden">✓</div>
          </div>
          <div id="m3-result" class="hidden">
            <p id="m3-result-text" class="math-result-text"></p>
            <button id="m3-again" class="inbox-submit"></button>
          </div>
          <div id="m3-start" class="game-start">
            <button id="m3-start-btn" class="inbox-submit"></button>
          </div>
        </div>
      </div>
        <div class="kids-col-pages" data-cat="games"></div>
      </div>
    </section>

    <!-- 你和我 -->
    <section id="space" class="page">
      <h2 class="section-title" data-i18n="spaceTitle">你和我</h2>
      <div id="space-login" class="inbox-form-card space-login">
        <p id="space-hint" class="space-hint"></p>
        <input id="space-username" type="text" maxlength="30" autocomplete="username">
        <input id="space-password" type="password" maxlength="30" autocomplete="current-password">
        <button id="space-login-btn" class="inbox-submit"></button>
        <p id="space-status" class="inbox-status"></p>
      </div>
      <div id="space-content" class="hidden"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p data-i18n="footer">© 2026 我的小站 · 用心记录每一天</p>
    <div class="footer-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=46"></script>
  <script src="js/data.js?v=46"></script>
  <script src="js/main.js?v=46"></script>
  <script src="js/nav-fx.js?v=46"></script>
  <script src="js/inbox.js?v=46"></script>
  <script src="js/game.js?v=46"></script>
  <script src="js/pvz.js?v=46"></script>
  <script src="js/minesweeper.js?v=46"></script>
  <script src="js/snake.js?v=46"></script>
  <script src="js/space-data.js?v=46"></script>
  <script src="js/space.js?v=46"></script>
  <script src="js/poem-data.js?v=46"></script>
  <script src="js/poem.js?v=46"></script>
  <script src="js/kids-content.js?v=46"></script>
  <script src="js/kids.js?v=46"></script>
  <script src="js/life.js?v=46"></script>
  <script src="js/sudoku-data.js?v=46"></script>
  <script src="js/sudoku.js?v=46"></script>
  <script src="js/gomoku.js?v=46"></script>
  <script src="js/daily-data.js?v=46"></script>
  <script src="js/daily.js?v=46"></script>
</body>
</html>
