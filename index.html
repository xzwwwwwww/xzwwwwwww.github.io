<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小站 · My Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#home" data-i18n="logo">小站</a>
      <div class="header-right">
        <nav class="nav">
          <a href="#home" class="nav-link active" data-i18n="navHome">首页</a>
          <a href="#life" class="nav-link" data-i18n="navLife">生活碎碎念</a>
          <a href="#inbox" class="nav-link" data-i18n="navInbox">留言信箱</a>
          <a href="#game" class="nav-link" data-i18n="navGame">小游戏</a>
          <a href="#space" class="nav-link" data-i18n="navSpace">你和我</a>
        </nav>
        <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 首页 -->
    <section id="home" class="page active">
      <div class="hero">
        <h1 data-i18n="heroTitle">你好，欢迎来到我的小站</h1>
        <p class="hero-sub" data-i18n="heroSub">在这里记录生活，存放读过的书与想过的路。</p>
      </div>

      <!-- 白熊吃拉面小场景 -->
      <div class="scene-card">
        <div class="bear-scene">
          <div class="steam s1"></div>
          <div class="steam s2"></div>
          <div class="steam s3"></div>
          <div class="bear">
            <div class="ear ear-l"></div>
            <div class="ear ear-r"></div>
            <div class="face">
              <div class="eye eye-l"></div>
              <div class="eye eye-r"></div>
              <div class="blush blush-l"></div>
              <div class="blush blush-r"></div>
            </div>
          </div>
          <div class="bowl"></div>
          <div class="table"></div>
        </div>
        <p class="scene-caption" data-i18n="sceneCaption">今天也要好好吃饭，认真生活 🍜</p>
      </div>
    </section>

    <!-- 生活碎碎念 -->
    <section id="life" class="page">
      <h2 class="section-title" data-i18n="lifeTitle">生活碎碎念</h2>
      <div id="life-timeline" class="timeline"></div>
    </section>

    <!-- 留言信箱 -->
    <section id="inbox" class="page">
      <h2 class="section-title" data-i18n="inboxTitle">留言信箱</h2>
      <div class="inbox-form-card">
        <input id="msg-username" type="text" maxlength="20">
        <textarea id="msg-content" rows="4" maxlength="500"></textarea>
        <button id="msg-submit" class="inbox-submit"></button>
        <p id="msg-status" class="inbox-status"></p>
      </div>
      <div id="msg-wall" class="msg-wall"></div>
      <div class="owner-entry">
        <button id="owner-toggle" class="owner-toggle"></button>
      </div>
      <div id="owner-panel" class="owner-panel hidden"></div>
    </section>

    <!-- 小游戏 -->
    <section id="game" class="page">
      <h2 class="section-title" data-i18n="gameTitle">小游戏</h2>
      <div class="game-tabs">
        <button class="game-tab active" data-game="sudoku" data-i18n="tabSudoku">数独</button>
        <button class="game-tab" data-game="miner" data-i18n="tabMiner">黄金矿工</button>
        <button class="game-tab" data-game="pvz" data-i18n="tabPvz">植物大战僵尸</button>
        <button class="game-tab" data-game="sweeper" data-i18n="tabSweeper">扫雷</button>
        <button class="game-tab" data-game="snake" data-i18n="tabSnake">贪吃蛇</button>
        <button class="game-tab" data-game="poem" data-i18n="tabPoem">古诗词</button>
        <button class="game-tab" data-game="climb" data-i18n="tabClimb">攀岩</button>
      </div>
      <div id="panel-sudoku" class="game-panel active">
        <div class="game-card sudoku-card">
          <div id="sudoku-levels" class="ms-levels sudoku-levels"></div>
          <div class="sudoku-info">
            <span id="sudoku-level-label"></span>
            <span id="sudoku-stars" class="sudoku-stars"></span>
            <span id="sudoku-time"></span>
            <span id="sudoku-mistakes"></span>
          </div>
          <div id="sudoku-board" class="sudoku-board"></div>
          <div id="sudoku-pad" class="sudoku-pad"></div>
          <div class="sudoku-tools">
            <button id="sudoku-notes" class="ms-level sudoku-tool"></button>
            <button id="sudoku-erase" class="ms-level sudoku-tool"></button>
            <button id="sudoku-hint" class="ms-level sudoku-tool"></button>
            <button id="sudoku-reset" class="ms-level sudoku-tool"></button>
          </div>
          <div id="sudoku-win" class="sudoku-win hidden">
            <p id="sudoku-win-text"></p>
            <p id="sudoku-win-best" class="sudoku-win-best"></p>
            <button id="sudoku-next" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-miner" class="game-panel">
        <div class="game-card">
          <canvas id="game-canvas" width="760" height="500"></canvas>
          <div class="game-bar">
            <button id="game-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-pvz" class="game-panel">
        <div class="game-card">
          <div id="pvz-levels" class="ms-levels pvz-levels"></div>
          <canvas id="pvz-canvas" width="800" height="600"></canvas>
          <div class="game-bar">
            <button id="pvz-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-sweeper" class="game-panel">
        <div class="game-card">
          <div id="ms-levels" class="ms-levels"></div>
          <div class="ms-bar">
            <span id="ms-mines"></span>
            <button id="ms-reset" class="ms-reset">😀</button>
            <span id="ms-time"></span>
          </div>
          <div class="ms-scroll">
            <div id="ms-grid" class="ms-grid"></div>
          </div>
          <p id="ms-status" class="inbox-status"></p>
          <button id="ms-restart" class="inbox-submit ms-restart">重新开始</button>
        </div>
      </div>
      <div id="panel-snake" class="game-panel">
        <div class="game-card">
          <div id="snake-modes" class="ms-levels snake-modes"></div>
          <canvas id="snake-canvas" width="520" height="520"></canvas>
          <div class="game-bar">
            <button id="snake-start" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-poem" class="game-panel">
        <div class="game-card poem-card">
          <div class="poem-bar">
            <span id="poem-progress"></span>
            <select id="poem-level-select"></select>
          </div>
          <h3 id="poem-title"></h3>
          <p id="poem-author" class="poem-author"></p>
          <div id="poem-quiz">
            <p id="poem-question"></p>
            <input id="poem-answer" type="text" maxlength="30" autocomplete="off">
            <button id="poem-submit" class="inbox-submit"></button>
            <p id="poem-status" class="inbox-status"></p>
          </div>
          <div id="poem-full" class="hidden">
            <div id="poem-lines"></div>
            <button id="poem-next" class="inbox-submit"></button>
          </div>
        </div>
      </div>
      <div id="panel-climb" class="game-panel">
        <div class="game-card">
          <div id="climb-levels" class="ms-levels climb-levels"></div>
          <div class="climb-info">
            <span id="climb-level-label"></span>
            <span id="climb-color" class="climb-color"></span>
            <span id="climb-moves"></span>
            <span id="climb-par"></span>
            <span id="climb-time"></span>
          </div>
          <div class="climb-strength"><div id="climb-strength-fill"></div></div>
          <canvas id="climb-canvas" width="480" height="600"></canvas>
          <p id="climb-hint" class="climb-hint"></p>
          <p id="climb-status" class="inbox-status"></p>
          <div class="game-bar">
            <button id="climb-reset" class="inbox-submit"></button>
            <button id="climb-mode" class="inbox-submit"></button>
            <button id="climb-clear-lines" class="inbox-submit"></button>
            <button id="climb-next" class="inbox-submit hidden"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 你和我 -->
    <section id="space" class="page">
      <h2 class="section-title" data-i18n="spaceTitle">你和我</h2>
      <div id="space-login" class="inbox-form-card space-login">
        <p id="space-hint" class="space-hint"></p>
        <input id="space-username" type="text" maxlength="30" autocomplete="username">
        <input id="space-password" type="password" maxlength="30" autocomplete="current-password">
        <button id="space-login-btn" class="inbox-submit"></button>
        <p id="space-status" class="inbox-status"></p>
      </div>
      <div id="space-content" class="hidden"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p data-i18n="footer">© 2026 我的小站 · 用心记录每一天</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=23"></script>
  <script src="js/data.js?v=23"></script>
  <script src="js/main.js?v=23"></script>
  <script src="js/inbox.js?v=23"></script>
  <script src="js/game.js?v=23"></script>
  <script src="js/pvz.js?v=23"></script>
  <script src="js/minesweeper.js?v=23"></script>
  <script src="js/snake.js?v=23"></script>
  <script src="js/space-data.js?v=23"></script>
  <script src="js/space.js?v=23"></script>
  <script src="js/poem-data.js?v=23"></script>
  <script src="js/poem.js?v=23"></script>
  <script src="js/climbing.js?v=23"></script>
  <script src="js/sudoku-data.js?v=23"></script>
  <script src="js/sudoku.js?v=23"></script>
</body>
</html>
